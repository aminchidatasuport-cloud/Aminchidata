<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transactions – AminchiData</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-900 text-slate-100">

  <div id="sidebar-overlay" class="hidden fixed inset-0 bg-black/50 z-10 lg:hidden sidebar-overlay"></div>

  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar flex flex-col z-20">
      <div class="p-5 border-b border-slate-700">
        <a href="index.html" class="flex items-center gap-2">
          <div class="w-9 h-9 bg-green-500 rounded-lg flex items-center justify-center">
            <i class="fa-solid fa-bolt text-white"></i>
          </div>
          <span class="text-xl font-extrabold"><span class="text-white">Aminchi</span><span class="text-green-400">Data</span></span>
        </a>
      </div>
      <nav class="flex-1 p-4 space-y-1">
        <a href="dashboard.html" class="sidebar-link"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
        <a href="fund-account.html" class="sidebar-link"><i class="fa-solid fa-building-columns"></i> Fund Account</a>
        <a href="data.html" class="sidebar-link"><i class="fa-solid fa-wifi"></i> Buy Data</a>
        <a href="airtime.html" class="sidebar-link"><i class="fa-solid fa-mobile-screen"></i> Buy Airtime</a>
        <a href="education.html" class="sidebar-link"><i class="fa-solid fa-graduation-cap"></i> Education</a>
        <a href="electricity.html" class="sidebar-link"><i class="fa-solid fa-bolt"></i> Electricity</a>
        <a href="cable.html" class="sidebar-link"><i class="fa-solid fa-tv"></i> Cable TV</a>
        <a href="transactions.html" class="sidebar-link active"><i class="fa-solid fa-clock-rotate-left"></i> Transactions</a>
        <a href="profile.html" class="sidebar-link"><i class="fa-solid fa-user-gear"></i> Profile</a>
      </nav>
      <div class="p-4 border-t border-slate-700">
        <button id="logout-btn" class="sidebar-link w-full text-red-400 hover:bg-red-500/10 hover:text-red-400">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
      <header class="bg-slate-800/70 border-b border-slate-700 px-4 sm:px-6 py-3.5 flex items-center gap-3 sticky top-0 z-10">
        <button id="sidebar-toggle" class="lg:hidden text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-700">
          <i class="fa-solid fa-bars text-lg"></i>
        </button>
        <h1 class="font-semibold text-white text-lg">Transaction History</h1>
        <div class="ml-auto flex items-center gap-3">
          <div class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center text-white font-bold text-sm" id="user-avatar-initial">U</div>
          <button id="logout-btn-mobile" class="text-sm text-slate-400 hover:text-red-400 p-1.5">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </header>

      <main class="flex-1 p-4 sm:p-6 lg:p-8">
        <!-- Stats -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
          <div class="stat-card">
            <div class="text-slate-400 text-sm mb-1">Total Transactions</div>
            <div class="text-2xl font-extrabold text-white" id="stat-total">—</div>
          </div>
          <div class="stat-card">
            <div class="text-slate-400 text-sm mb-1">Successful</div>
            <div class="text-2xl font-extrabold text-green-400" id="stat-success">—</div>
          </div>
          <div class="stat-card">
            <div class="text-slate-400 text-sm mb-1">Total Spent</div>
            <div class="text-2xl font-extrabold text-white" id="stat-spent">—</div>
          </div>
        </div>

        <!-- Filters + Table -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden">
          <!-- Filters -->
          <div class="px-5 py-4 border-b border-slate-700 flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap gap-2">
              <button data-filter="All"         class="px-3.5 py-1.5 rounded-lg text-sm font-medium bg-green-500 text-white transition-all">All</button>
              <button data-filter="Data"        class="px-3.5 py-1.5 rounded-lg text-sm font-medium text-slate-400 hover:text-white bg-slate-700 hover:bg-slate-600 transition-all">Data</button>
              <button data-filter="Airtime"     class="px-3.5 py-1.5 rounded-lg text-sm font-medium text-slate-400 hover:text-white bg-slate-700 hover:bg-slate-600 transition-all">Airtime</button>
              <button data-filter="Education"   class="px-3.5 py-1.5 rounded-lg text-sm font-medium text-slate-400 hover:text-white bg-slate-700 hover:bg-slate-600 transition-all">Education</button>
              <button data-filter="Electricity" class="px-3.5 py-1.5 rounded-lg text-sm font-medium text-slate-400 hover:text-white bg-slate-700 hover:bg-slate-600 transition-all">Electricity</button>
            </div>
            <span id="tx-count" class="text-sm text-slate-500"></span>
          </div>

          <!-- Table -->
          <div class="overflow-x-auto">
            <table class="tx-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Type</th>
                  <th class="hidden sm:table-cell">Description</th>
                  <th>Amount</th>
                  <th>Status</th>
                  <th class="hidden md:table-cell">Ref. ID</th>
                </tr>
              </thead>
              <tbody id="tx-table-body">
                <tr><td colspan="6" class="text-center py-8 text-slate-500">Loading...</td></tr>
              </tbody>
            </table>
          </div>

          <!-- Empty State -->
          <div id="tx-empty" class="hidden text-center py-16 px-4">
            <div class="w-16 h-16 bg-slate-700 rounded-full flex items-center justify-center mx-auto mb-4">
              <i class="fa-solid fa-inbox text-slate-500 text-2xl"></i>
            </div>
            <h3 class="font-semibold text-slate-400 mb-1">No transactions found</h3>
            <p class="text-slate-600 text-sm">Try selecting a different filter.</p>
          </div>

          <!-- Pagination -->
          <div class="px-5 py-4 border-t border-slate-700 flex justify-center" id="pagination"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/transactions.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = Auth.getUser();
      const el = document.getElementById('user-avatar-initial');
      if (user && el) el.textContent = user.name.charAt(0).toUpperCase();
    });
  </script>
</body>
</html>
